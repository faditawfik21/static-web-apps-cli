name: Trigger auto deployment for ft-aca-labels-1

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ft-aca-labels-1-AutoDeployTrigger-5bcb89d1-ecc9-4327-a6d6-7f9aa4158f72.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.FTACALABELS1_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FTACALABELS1_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FTACALABELS1_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.FTACALABELS1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FTACALABELS1_REGISTRY_PASSWORD }}
          containerAppName: ft-aca-labels-1
          resourceGroup: ft-aca-labels
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


